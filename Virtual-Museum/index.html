<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Museum | Virtual Collection</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="brand">◇ Virtual Museum</div>
    <div>
      <button class="top-button" onclick="showFavorites()">
        Saved: <span id="favoriteCount">0</span>
      </button>
      <button class="top-button" onclick="toggleTheme()">☾ Theme</button>
    </div>
  </header>

  <div class="layout">
    <nav>
      <button class="nav-btn active" onclick="navigate('home', this)">Overview</button>
      <button class="nav-btn" onclick="navigate('collection', this)">Explore Collection</button>
      <button class="nav-btn" onclick="navigate('compare', this)">Compare Artifacts</button>
      <button class="nav-btn" onclick="navigate('feedback', this)">Feedback</button>
    </nav>

    <main id="content"></main>
  </div>

  <dialog id="artifactDialog"></dialog>
  <div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
